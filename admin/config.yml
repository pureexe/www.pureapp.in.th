# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: ระบบจัดการโพส pure.in.th

logo:
  src: /assets/images/p-logo.svg
  show_in_header: true


backend:
  name: github
  repo: pureexe/www.pureapp.in.th

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: "posts"
    label: "Published Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{thumbnail}}"
    media_folder: "/assets/images/post/{{slug}}"
    public_folder: "/assets/images/post/{{slug}}"
    fields:
      - name: "title"
        label: "Title"
      - name: "date"
        label: "Date"
        widget: "datetime"
      - name: thumbnail
        label: "Thumbnail"
        widget: "image"
        required: false
      - name: "tags"
        label: "Tags"
        widget: "select"
        multiple: true
        options:
          - announcement
          - computer
          - diary
          - mathematics
          - review
          - science
          - other
      - name: "body"
        label: "Body" 
        widget: "markdown"

  - name: "drafts"
    label: "Drafts"
    folder: "_drafts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{thumbnail}}"   
    media_folder: "/assets/images/post/{{slug}}"
    public_folder: "/assets/images/post/{{slug}}"
    fields:
      - name: "title"
        label: "Title"
      - name: "date"
        label: "Date"
        widget: "datetime"
      - name: thumbnail
        label: "Thumbnail"
        widget: "image"
        required: false
      - name: "tags"
        label: "Tags"
        widget: "select"
        multiple: true
        options:
          - announcement
          - computer
          - diary
          - mathematics
          - review
          - science
          - other
      - name: "body"
        label: "Body" 
        widget: "markdown"
