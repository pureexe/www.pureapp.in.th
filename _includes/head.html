<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="generator" content="Jekyll v{{ jekyll.version }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} ~ {{ site.title }}{% else %}{{ site.title_frontpage }} ~ {{ site.title }} {% endif %}</title>
  {% include seo-header.html %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
  <link rel="shortcut icon" href="{{ "/favicon.ico" | prepend: site.baseurl}}">
  <link rel="icon" sizes="192x192" href="/assets/images/pureapp-logo-rect.png">
  <link rel="stylesheet" href="{{ "/assets/css/bulma-v1.0.4.min.css" | prepend: site.baseurl }}?v=20260228-1">
  <link rel="stylesheet" href="{{ "/assets/css/fontawesome-v6.7.2.all.min.css" | prepend: site.baseurl }}?v=20260228-1">
  <link rel="stylesheet" href="{{ "/assets/css/fonts.css" | prepend: site.baseurl }}?v=20260228-1">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | prepend: site.baseurl }}?v=20260228-1">
  <script>
      // select theme (Need to include script there to anti blocking)
      (function() {
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const themeToApply = savedTheme || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', themeToApply);
      })();
  </script>
</head>
